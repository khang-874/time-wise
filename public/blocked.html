<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Blocked — TimeWise</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1b4b;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    .card { text-align: center; max-width: 380px; padding: 0 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p  { font-size: 14px; color: rgba(255,255,255,0.6); margin: 0 0 28px; }
    button {
      padding: 10px 24px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:56px;margin-bottom:16px">🚫</div>
    <h1 id="title">Site blocked</h1>
    <p id="reason">You've blocked this domain in TimeWise.</p>
    <button onclick="history.back()">Go back</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get("title");
    const reason = params.get("reason");
    if (title) document.getElementById("title").textContent = title;
    if (reason) document.getElementById("reason").textContent = reason;
  </script>
</body>
</html>
